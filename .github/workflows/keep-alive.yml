name: ZELTRA 7/24 Render Keep-Alive & Canlı Tarama

on:
  schedule:
    # Her 5 dakikada bir çalışır (GitHub gecikmesi olsa bile Render'ın 15 dk uyku sınırına takılmaz)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: zeltra-render-keep-alive
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health (Render Uyanık Tut & Otonom Bot Tetiği)
        run: |
          echo "Pinging https://zeltra-ru7m.onrender.com/api/health ..."
          RESP=$(curl -fsS --max-time 60 --retry 2 --retry-delay 5 "https://zeltra-ru7m.onrender.com/api/health")
          echo "HEALTH: $RESP"

      - name: Sync /api/live-audit (/canli Tahmin Kilit & Sonuçlandırma)
        run: |
          echo "Syncing https://zeltra-ru7m.onrender.com/api/live-audit ..."
          AUDIT=$(curl -fsS --max-time 45 "https://zeltra-ru7m.onrender.com/api/live-audit")
          echo "$AUDIT" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log('LIVE AUDIT OK:', {
              equity: d.portfolio?.totalEquityTRY,
              netTRY: d.portfolio?.netProfitTRY,
              open: d.portfolio?.openPositionsCount,
              locked: d.forecastSummary?.totalLocked,
              settled: d.forecastSummary?.settledCount,
              hitRate: d.forecastSummary?.directionHitRatePct
            });
          "
